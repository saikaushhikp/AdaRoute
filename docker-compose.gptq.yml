# CUDA-only GPTQ Int4 test profile.
#
# Run with `just gpu-gptq-up` after creating .env.gpu from its example.
#
# The CPU image on this host loads the model but does not provide the
# cpu_gemm_wna16 custom operator required for GPTQ token generation.
services:
  vllm:
    command: >
      Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
      --served-model-name Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
      --quantization gptq
      --port 8000
      --host 0.0.0.0
      --dtype ${VLLM_DTYPE:-float16}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-4096}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.90}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --pipeline-parallel-size ${VLLM_PIPELINE_PARALLEL_SIZE:-1}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-128}
      --swap-space ${VLLM_SWAP_SPACE_GB:-4}
      --enable-prefix-caching
  gateway:
    environment:
      - ADAROUTE_CONFIG=/app/config.gptq.yaml
