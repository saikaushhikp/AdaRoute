# CUDA-only GPTQ Int4 test profile.
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.gptq.yml up --build
#
# The CPU image on this host loads the model but does not provide the
# cpu_gemm_wna16 custom operator required for GPTQ token generation.
services:
  vllm:
    command: >
      Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
      --served-model-name Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
      --quantization gptq
      --port 8000
      --host 0.0.0.0
      --dtype ${VLLM_DTYPE:-float16}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-4096}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.85}
