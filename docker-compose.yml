services:
  ollama:
    image: ollama/ollama:latest
    container_name: adaroute-ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - adaroute-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  redis:
    image: redis:7-alpine
    container_name: adaroute-redis
    ports:
      - "6379:6379"
    networks:
      - adaroute-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  # Optional vLLM serving container (for GPU / dedicated self-hosted workloads)
  # Run with: docker compose --profile vllm up
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["vllm"]
    container_name: adaroute-vllm
    ports:
      - "8001:8000"
    ipc: host
    networks:
      - adaroute-net
    command: --model Qwen/Qwen2.5-1.5B-Instruct --port 8000

  gateway:
    image: adaroute:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaroute-gateway
    command: uvicorn adaroute.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - ollama
      - redis
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - adaroute-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: adaroute-ui
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - adaroute-net

volumes:
  ollama-data:
    driver: local

networks:
  adaroute-net:
    driver: bridge
