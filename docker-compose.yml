services:
  # ---------------------------------------------------------------------------
  # vLLM – primary local inference engine (OpenAI-compatible API)
  # Default: CPU mode (works on any machine, no GPU required).
  #
  # For GPU acceleration run:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
  #
  # For the CUDA-only GPTQ Int4 test profile, see docker-compose.gptq.yml.
  # ---------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai-cpu:latest-x86_64
    container_name: adaroute-vllm
    ports:
      - "${VLLM_PORT:-8001}:8000"
    expose:
      - "8000"
    ipc: host
    networks:
      - adaroute-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_TARGET_DEVICE=cpu
      # Keep the CPU KV cache within the memory available to local development.
      - VLLM_CPU_KVCACHE_SPACE=${VLLM_CPU_KVCACHE_SPACE:-2}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    command: >
      ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      --served-model-name ${VLLM_SERVED_MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
      --port 8000
      --host 0.0.0.0
      --dtype ${VLLM_DTYPE:-bfloat16}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-2048}
      --enforce-eager
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    container_name: adaroute-redis
    ports:
      - "6379:6379"
    networks:
      - adaroute-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  gateway:
    image: adaroute:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaroute-gateway
    command: uvicorn adaroute.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - VLLM_BASE_URL=http://vllm:8000/v1
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_MODE=${EXECUTION_MODE:-hybrid}
    volumes:
      - .:/app
    depends_on:
      vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - adaroute-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: adaroute-ui
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - adaroute-net

volumes:
  huggingface-cache:
    driver: local

networks:
  adaroute-net:
    driver: bridge
