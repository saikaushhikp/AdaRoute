# AdaRoute Model Registry & Gateway Configuration
# Defines local and external model metadata, pricing, quality, SLA, and replica endpoints.
# Sourced from official provider documentation (Google AI Studio, Groq, Cohere, Ollama) and LMSYS Arena.

gateway:
  host: "0.0.0.0"
  port: 8000
  title: "AdaRoute Unified AI Gateway"
  version: "3.0.0"
  default_policy: "adaptive"
  default_scheduler: "slo_aware"
  execution_mode: "hybrid"  # "real" (strict fail-closed if unreachable) | "simulation" | "hybrid"
  auth_required: false       # When true, strictly requires Bearer API key in Authorization header

registry:
  compatibility_models: true # When false, strictly disables fallback legacy model injection

estimation:
  default_prior: 80
  task_priors:
    qa: 50
    factual_qa: 45
    summarization: 160
    coding: 280
    reasoning: 220
    structured_extraction: 90
    creative: 250
    general: 80
  max_token_ratio: 0.15
  prompt_expansion_threshold: 500
  prompt_expansion_ratio: 1.25
  historical_quantile: 0.75

routing:
  default_policy: "adaptive"
  default_scheduler: "slo_aware"
  static_task_map:
    coding: "gpt-4o-external"
    reasoning: "gpt-4o-external"
    summarization: "Qwen/Qwen2.5-0.5B-Instruct"
    qa: "Qwen/Qwen2.5-0.5B-Instruct"
    general: "Qwen/Qwen2.5-0.5B-Instruct"
  policies:
    adaptive:
      weights:
        cost: 0.35
        latency: 0.20
        quality: 0.30
        slo: 0.10
        failure: 0.05
    latency_first:
      weights:
        cost: 0.10
        latency: 0.65
        quality: 0.15
        slo: 0.05
        failure: 0.05
    cost_first:
      weights:
        cost: 0.70
        latency: 0.10
        quality: 0.10
        slo: 0.05
        failure: 0.05
    quality_first:
      weights:
        cost: 0.10
        latency: 0.15
        quality: 0.65
        slo: 0.05
        failure: 0.05

models:
  # -------------------------------------------------------------
  # Local vLLM Models (Self-Hosted, GPU-accelerated, Internal/Confidential Safe)
  # Served via vLLM OpenAI-compatible API (http://vllm:8000/v1 inside Docker)
  # -------------------------------------------------------------
  - model_id: "Qwen/Qwen2.5-0.5B-Instruct"
    logical_aliases: ["general", "coding", "qa", "summarization", "fast"]
    provider: "vllm"
    execution_type: "local"
    litellm_model: "openai/Qwen/Qwen2.5-0.5B-Instruct"
    base_url: "http://vllm:8000/v1"
    privacy_levels: ["public", "internal_only", "confidential", "restricted"]
    cost_per_1k_input: 0.000010   # Local GPU compute amortization
    cost_per_1k_output: 0.000020
    quality: 0.73                 # Open LLM Leaderboard / MMLU ~61%
    max_context: 32768
    replicas:
      - replica_id: "vllm-r1"
        endpoint: "http://vllm:8000"
        availability: true
        weight: 1.0
      - replica_id: "vllm-r2"
        endpoint: "http://vllm:8000"
        availability: true
        weight: 1.0

  # Enabled by docker-compose.gptq.yml on a CUDA host.
  - model_id: "Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4"
    logical_aliases: ["gptq-4bit"]
    provider: "vllm"
    execution_type: "local"
    litellm_model: "openai/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4"
    base_url: "http://vllm:8000/v1"
    privacy_levels: ["public", "internal_only", "confidential", "restricted"]
    cost_per_1k_input: 0.000010
    cost_per_1k_output: 0.000020
    quality: 0.73
    max_context: 32768
    replicas:
      - replica_id: "vllm-gptq-r1"
        endpoint: "http://vllm:8000"
        availability: true
        weight: 1.0

  - model_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    logical_aliases: ["reasoning", "complex"]
    provider: "vllm"
    execution_type: "local"
    litellm_model: "openai/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    base_url: "http://vllm:8000/v1"
    privacy_levels: ["public", "internal_only", "confidential", "restricted"]
    cost_per_1k_input: 0.000030   # Local GPU compute amortization
    cost_per_1k_output: 0.000080
    quality: 0.85                 # DeepSeek-R1 Distill 1.5B, MATH-500: 83.9%
    max_context: 131072
    replicas:
      - replica_id: "vllm-deepseek-r1"
        endpoint: "http://vllm:8000"
        availability: true
        weight: 1.0

  # -------------------------------------------------------------
  # External Cloud Providers (via LiteLLM, Public Only)
  # Pricing and context windows sourced from official provider pricing pages
  # -------------------------------------------------------------
  - model_id: "gemini/gemini-flash-latest"
    logical_aliases: ["general", "fast", "qa", "summarization", "coding"]
    provider: "gemini"
    execution_type: "external"
    litellm_model: "gemini/gemini-flash-latest"
    api_key_env: "GOOGLE_API_KEY"
    privacy_levels: ["public"]
    cost_per_1k_input: 0.000075   # Official Google AI Studio: $0.075 / 1M tokens
    cost_per_1k_output: 0.000300  # Official Google AI Studio: $0.30 / 1M tokens
    quality: 0.89                 # LMSYS Chatbot Arena ELO ~1268, MMLU ~80.1%
    max_context: 1048576          # 1,048,576 tokens (1M context window)
    replicas: []

  - model_id: "groq/qwen/qwen3.8-27b"
    logical_aliases: ["general", "fast", "coding"]
    provider: "groq"
    execution_type: "external"
    litellm_model: "groq/qwen/qwen3.8-27b"
    api_key_env: "GROQ_API_KEY"
    privacy_levels: ["public"]
    cost_per_1k_input: 0.00080    # Official Groq pricing: $0.80 / 1M tokens
    cost_per_1k_output: 0.00400   # Official Groq pricing: $4.00 / 1M tokens
    quality: 0.87                 # Qwen3 27B class, LMSYS Arena ELO ~1250
    max_context: 131072           # Groq API verified context length
    replicas: []

  - model_id: "cohere/command-r-08-2024"
    logical_aliases: ["general", "reasoning"]
    provider: "cohere"
    execution_type: "external"
    litellm_model: "cohere/command-r-08-2024"
    api_key_env: "COHERE_CHAT_API_KEY"
    privacy_levels: ["public"]
    cost_per_1k_input: 0.00015    # Official Cohere pricing: $0.15 / 1M tokens
    cost_per_1k_output: 0.00060   # Official Cohere pricing: $0.60 / 1M tokens
    quality: 0.83                 # LMSYS Arena ELO ~1200
    max_context: 128000           # Official Cohere Command R context length
    replicas: []

  # -------------------------------------------------------------
  # Mock Backends (Deterministic Regression & Testing)
  # -------------------------------------------------------------
  - model_id: "gpt-4o-external"
    logical_aliases: ["general", "coding", "reasoning", "flagship"]
    provider: "mock-external"
    execution_type: "mock"
    litellm_model: "mock/gpt-4o"
    privacy_levels: ["public"]
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.015
    quality: 0.98
    max_context: 128000
    replicas:
      - replica_id: "replica-gpt-4o-1"
        endpoint: "mock://external-1"
        availability: true
        weight: 1.0

  - model_id: "llama-3-8b"
    logical_aliases: ["general", "qa"]
    provider: "mock-local"
    execution_type: "mock"
    litellm_model: "mock/llama-3-8b"
    privacy_levels: ["public", "internal_only", "confidential", "restricted"]
    cost_per_1k_input: 0.0005
    cost_per_1k_output: 0.0015
    quality: 0.79
    max_context: 8192
    replicas:
      - replica_id: "replica-llama-1"
        endpoint: "mock://local-llama"
        availability: true
        weight: 1.0
