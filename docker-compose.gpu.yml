# GPU override — merges on top of docker-compose.yml.
#
# Use `just gpu-up` after copying .env.gpu.example to .env.gpu. This profile
# serves one GPU model per vLLM process; set VLLM_TENSOR_PARALLEL_SIZE to the
# number of selected GPUs when sharding a single model across devices.
#
# vLLM Docker: https://docs.vllm.ai/en/latest/deployment/docker/
# Compose GPU reservations: https://docs.docker.com/compose/how-tos/gpu-support/
#
# Requires: NVIDIA Container Toolkit installed on the host
# Install guide: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:
  vllm:
    image: vllm/vllm-openai:latest
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_TARGET_DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    command: >
      ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --served-model-name ${VLLM_SERVED_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      --port 8000
      --host 0.0.0.0
      --dtype ${VLLM_DTYPE:-bfloat16}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.90}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --pipeline-parallel-size ${VLLM_PIPELINE_PARALLEL_SIZE:-1}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-128}
      --swap-space ${VLLM_SWAP_SPACE_GB:-4}
      --enable-prefix-caching
  gateway:
    environment:
      # The GPU catalog maps logical aliases to the model served above.
      - ADAROUTE_CONFIG=/app/config.gpu.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
