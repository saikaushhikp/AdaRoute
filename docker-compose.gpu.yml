# GPU override — merges on top of docker-compose.yml.
#
# Use `just gpu-up` after copying .env.gpu.example to .env.gpu (API keys only).
#
# Serves both local GGUF models concurrently inside a SINGLE vLLM container
# (adaroute-vllm) via scripts/vllm_multi_server.py:
#   - unsloth/Qwen3-0.6B-GGUF:Q4_K_M
#   - unsloth/gemma-3-1b-it-GGUF:Q4_K_M
#
# The model selector routes requests to http://vllm:7000/v1, where the internal
# router dispatches to the selected model engine.

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: adaroute-vllm
    gpus: all
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_TARGET_DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ADAROUTE_CONFIG=/app/config.gpu.yaml
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - .:/app:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        pip install vllm-gguf-plugin && \
        python3 /app/scripts/vllm_multi_server.py
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7000/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 300s

  gateway:
    environment:
      - ADAROUTE_CONFIG=/app/config.gpu.yaml
      - EXECUTION_MODE=real
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
